name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (must already exist)'
        required: true

permissions:
  contents: write   # needed to create the release and upload binaries

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The dispatch input is USED, not decoration: without it a manual run
          # asked for a tag, ignored the answer, and built whatever the
          # dispatched branch happened to be.
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0   # `make dist` stamps the version from git describe

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      # The gate runs again here rather than trusting that CI passed on the
      # commit: a tag can point at anything, including a commit CI never saw.
      - name: verify
        run: |
          gofmt -l . | tee /tmp/fmt
          test ! -s /tmp/fmt
          go build ./...
          go vet ./...
          go test ./... -race -timeout 15m

      # CGO_ENABLED=0 is what makes the promise on the tin true: a single
      # static binary with no runtime dependencies, which runs on a distro
      # whose libc is older than the builder's.
      - name: cross-compile
        run: make dist

      - name: checksums
        run: |
          cd dist
          sha256sum mabo-ctl-* > SHA256SUMS
          cat SHA256SUMS

      - name: publish
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          # Likewise explicit: on a tag push GITHUB_REF is the tag, but on a
          # manual dispatch it is a branch, and the action would have had no tag
          # to attach the release to.
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            dist/mabo-ctl-*
            dist/SHA256SUMS
          generate_release_notes: true
          draft: false

      # Homebrew: regenerate Formula/mabo-ctl.rb in the tap from this release's
      # checksums and push it, so `brew install maborak/tap/mabo-ctl` follows
      # every release. The push uses TAP_DEPLOY_KEY, the private half of a
      # write deploy key on maborak/homebrew-tap alone — narrower than any
      # token. Skipped, with a notice, while that secret is unset; a secret
      # cannot be tested in `if:`, so this step turns it into an output.
      - name: homebrew tap key
        id: tapkey
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: |
          if [ -n "$TAP_DEPLOY_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::TAP_DEPLOY_KEY is not set; skipping the Homebrew tap update"
          fi

      - name: homebrew tap checkout
        if: steps.tapkey.outputs.enabled == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: maborak/homebrew-tap
          ssh-key: ${{ secrets.TAP_DEPLOY_KEY }}
          path: tap

      - name: homebrew tap
        if: steps.tapkey.outputs.enabled == 'true'
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          mkdir -p tap/Formula
          sh packaging/homebrew/formula.sh "$TAG" dist/SHA256SUMS > tap/Formula/mabo-ctl.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/mabo-ctl.rb
          if git diff --cached --quiet; then
            echo "formula already at $TAG"
            exit 0
          fi
          git commit -m "mabo-ctl ${TAG#v}"
          git push origin HEAD
