<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="mabo-ctl-token" content="__RAPIDOC_TOKEN__">
<title>mabo-ctl — API Reference</title>
<style>
  :root { color-scheme: light dark; }
  html, body { margin: 0; height: 100%; }
  body {
    font: 13px/1.5 Monaco, Menlo, Consolas, monospace;
    --bar-bg: #ffffff; --bar-border: #d1d9e0; --bar-fg: #1f2328; --bar-dim: #656d76;
    --bar-link: #0969da;
  }
  @media (prefers-color-scheme: dark) {
    body {
      --bar-bg: #161b22; --bar-border: #30363d; --bar-fg: #e6edf3; --bar-dim: #8b949e;
      --bar-link: #58a6ff;
    }
  }
  .topbar {
    display: flex; align-items: center; gap: 16px;
    padding: 10px 24px; background: var(--bar-bg); border-bottom: 1px solid var(--bar-border);
    color: var(--bar-fg);
  }
  .topbar h1 { font-size: 15px; margin: 0; }
  .topbar .sub { color: var(--bar-dim); font-size: 13px; }
  .topbar .spacer { flex: 1; }
  .topbar a { color: var(--bar-link); text-decoration: none; font-size: 13px; }
  .topbar a:hover { text-decoration: underline; }
  .topbar .note { color: var(--bar-dim); font-size: 12px; }
  #api-reference {
    display: block;
    height: calc(100vh - 45px);
    width: 100%;
  }
  .framed .topbar { display: none; }
  .framed #api-reference { height: 100vh; }
  .server-editor { padding: 8px 0; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .server-editor input { min-width: 240px; flex: 1; padding: 6px; font: inherit; }
  .server-editor button { padding: 6px 12px; font: inherit; cursor: pointer; }
  .server-editor p { flex-basis: 100%; margin: 0; }
</style>
</head>
<body>

<div class="topbar">
  <h1>mabo-ctl</h1>
  <span class="sub">API Reference</span>
  <span class="note" id="authnote" title="The session token is sent with every try-it request as X-Mabo-Ctl-Token">authenticated</span>
  <span class="spacer"></span>
  <a href="/">&larr; Console</a>
</div>

<!--
  The playground: RapiDoc API Reference (vendored at /api-docs/rapidoc.js).
  Every endpoint has an interactive API client. The authenticated page's token
  initializes the spec's single header scheme once. The browser's origin selects
  this console, including through tunnels. The spec is loaded from /api/openapi.yaml (a
  same-origin, session-authenticated request).
-->
<div id="api-reference">
  <rapi-doc
    spec-url="/api/openapi.yaml"
    server-url="/"
    default-api-server="/"
    persist-auth="false"
    show-header="false"
    theme="auto"
    render-style="view"
    schema-style="table"
    schema-description-expanded="true"
    default-schema-tab="schema"
    allow-spec-file-download="true"
    load-fonts="false"
    regular-font="Monaco, Menlo, Consolas, monospace"
    mono-font="Monaco, Menlo, Consolas, monospace"
  >
    <div slot="servers" class="server-editor">
      <label for="api-server-url">Server URL</label>
      <input id="api-server-url" type="url" aria-describedby="server-note" spellcheck="false">
      <button type="button" id="apply-api-server" disabled>Apply URL</button>
      <p id="server-note" role="status">Defaults to this browser's origin. Try-it requests stay same-origin to protect your key.</p>
    </div>
  </rapi-doc>
</div>

<noscript><p style="padding:24px">The API reference needs JavaScript to render.</p></noscript>

<script>
  // Framed by the console's API tab: the console's own header already says
  // where this is, and the Console link would nest the console inside itself.
  // The tab passes its resolved theme so both halves of the page match.
  (function () {
    var reference = document.querySelector("rapi-doc");
    var serverInput = document.getElementById("api-server-url");
    var applyServer = document.getElementById("apply-api-server");
    var serverNote = document.getElementById("server-note");
    var origin = window.location.origin;
    serverInput.value = origin;
    reference.setAttribute("server-url", origin);
    reference.setAttribute("default-api-server", origin);
    // Once only: clearing or replacing the key in RapiDoc must stick.
    reference.addEventListener("spec-loaded", function (event) {
      var token = document.querySelector('meta[name="mabo-ctl-token"]').content;
      reference.setApiKey("tokenHeader", token);
      // Do not offer the spec's internal loopback address to a tunneled browser.
      event.detail.servers.splice(0, event.detail.servers.length, {url: origin, computedUrl: origin});
      reference.setApiServer(origin);
      applyServer.disabled = false;
    }, {once: true});
    applyServer.addEventListener("click", function () {
      try {
        var url = new URL(serverInput.value);
        if (!/^https?:$/.test(url.protocol) || url.username || url.password || url.search || url.hash) {
          throw new Error("Use an HTTP(S) base URL without credentials, query or fragment.");
        }
        if (url.origin !== origin) {
          throw new Error("Use this console's origin. For another host, open its /api-docs page; your session key is never forwarded to another origin.");
        }
        var base = url.href.replace(/\/$/, "");
        var servers = reference.resolvedSpec.servers;
        if (!servers.some(function (server) { return server.url === base; })) {
          servers.push({url: base, computedUrl: base});
        }
        reference.setApiServer(base);
        serverNote.textContent = "Using " + base;
      } catch (err) { serverNote.textContent = err.message; }
    });
    if (window.self !== window.top) {
      document.body.classList.add("framed");
      var t = new URLSearchParams(window.location.search).get("theme");
      if (t === "light" || t === "dark") {
        reference.setAttribute("theme", t);
        document.documentElement.style.colorScheme = t;
      }
    }
  }());
</script>
<script src="/api-docs/rapidoc.js"></script>
</body>
</html>
