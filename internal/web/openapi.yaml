openapi: "3.0.3"
info:
  title: mabo-ctl web console API
  description: |
    HTTP API served by `mabo-ctl serve`. Every route is registered from the
    single source of truth in `internal/web/routes.go`. The machine-readable
    catalogue (`mabo-ctl schema --commands`) is generated from the same source.

    ## Authentication

    - **Session**: Cookie (`mabo-ctl_console_<port>` — the name embeds the bound
      port so two consoles do not clash), `?token=`, or `X-Mabo-Ctl-Token`
      header. Required for all routes.
    - **Token**: `X-Mabo-Ctl-Token` header only (not cookie or query). Required
      for POST routes. This is the CSRF defence: a cross-origin page cannot
      attach custom headers without triggering a CORS preflight, which this
      server never answers.

    Authentication failures preserve HTTP 403 and return JSON
    `{"error":"invalid_api_key"}`. Role denials return HTTP 403 with
    `{"error":"forbidden"}`. No login instructions or credentials are included.

    ## Security

    Operator credentials have full access. Shared roles are server-enforced:
    `read` reads stack/configuration/logs, `view` adds presentation mirroring,
    and `write` adds only service lifecycle controls. No guest can use terminals,
    edit configuration/trusted origins, rotate tokens or manage shares. An invalid
    explicit query/header credential never falls back to an operator cookie.
    Shares and guest history are in-memory for this serve run. Revocation closes
    existing streams; it cannot undo an accepted action or erase copied data.

    Every response carries: `X-Content-Type-Options: nosniff`,
    `Referrer-Policy: no-referrer`, `X-Frame-Options: DENY`,
    `Cache-Control: no-store`. No `Access-Control-Allow-*` headers are set.

    ## Redaction

    Credential-shaped values in health URLs, command arguments, and environment
    values are replaced with `[redacted]` by `internal/redact`.
  version: "1.4.0"
  contact:
    name: mabo-ctl
    url: https://github.com/maborak/mabo-ctl

servers:
  - url: http://127.0.0.1:{port}
    description: Local web console (loopback only)
    variables:
      port:
        default: "7999"
        description: Port printed by `mabo-ctl serve`

security:
  - sessionCookie: []
  - tokenHeader: []

paths:

  /health:
    get:
      summary: Server liveness check (unauthenticated)
      description: |
        Returns 200 when the web server is running. This is the only route
        that does not require authentication — monitoring tools, load
        balancers and CI probes need it without a session token. Reveals
        nothing beyond liveness: no service state, no version, no uptime.
      security: []
      responses:
        "200":
          description: Server is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ok]
              example:
                status: ok

  /:
    get:
      summary: Console page
      description: |
        The web console HTML page. An unauthenticated browser gets a token-entry
        form (401); an authenticated one gets the full console (200).
      security:
        - sessionCookie: []
        - tokenHeader: []
        - queryToken: []
      responses:
        "200":
          description: Console page (authenticated)
          content:
            text/html:
              schema:
                type: string
        "401":
          description: Unlock page (token entry form)
          content:
            text/html:
              schema:
                type: string

  /api/services:
    get:
      summary: List declared services
      description: "Every declared service as resolved: name, dir, cmd, runtime, port, health URL, dependencies, colours."
      responses:
        "200":
          description: Service list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServiceInfo"

  /api/config:
    get:
      summary: Resolved configuration
      description: |
        The loaded `mabo-ctl.yaml` plus where each resolved port came from.
        Matches `mabo-ctl config --json` exactly.
      responses:
        "200":
          description: Config view
          content:
            application/json:
              schema:
                type: object

  /api/status:
    get:
      summary: Service status (stable contract)
      description: |
        One status per service, shaped exactly like `mabo-ctl status --json`.
        **This is a stable machine contract.** Running readiness probes is a
        side effect of this route.
      responses:
        "200":
          description: Status array
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StatusRecord"

  "/api/logs/{svc}":
    get:
      summary: Recent log lines
      description: The last N lines of a service's log.
      parameters:
        - $ref: "#/components/parameters/svc"
        - name: tail
          in: query
          schema:
            type: integer
            default: 200
            maximum: 5000
          description: >-
            Number of lines to return. Clamped to 5000, and to 8 MiB of history:
            older lines past the byte budget become one leading
            "[mabo-ctl: N earlier lines omitted; ...]" line, which counts toward
            `count`.
      responses:
        "200":
          description: Log lines
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogsResponse"
        "404":
          description: Unknown service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorWithValid"

  "/api/stream/{svc}":
    get:
      summary: Live log stream (SSE)
      description: |
        Server-Sent Events stream of one service's log output. Each event is
        unnamed with a JSON data payload.
      parameters:
        - $ref: "#/components/parameters/svc"
        - name: tail
          in: query
          schema:
            type: integer
            default: 200
            maximum: 5000
          description: >-
            Initial replay count. Clamped to 5000 and to 8 MiB of history (older
            lines become one omission marker line).
      responses:
        "200":
          description: SSE event stream
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  SSE events with JSON data payloads. See LogLine and StreamEnd schemas.
        "404":
          description: Unknown service

  /api/stream/all:
    get:
      summary: Merged log stream (SSE)
      description: |
        SSE stream of every running service's log, interleaved. Each line
        carries its `service` field for labeling/filtering.
      parameters:
        - name: tail
          in: query
          schema:
            type: integer
            default: 200
            maximum: 5000
          description: >-
            Initial replay count per service. Clamped to 5000 and to 8 MiB of
            history per service.
      responses:
        "200":
          description: SSE event stream
          content:
            text/event-stream:
              schema:
                type: string
        "404":
          description: No services declared

  /api/events:
    get:
      summary: Lifecycle events (SSE)
      description: |
        Server-Sent Events stream of lifecycle events (phase transitions) for
        the whole stack.
      responses:
        "200":
          description: SSE event stream
          content:
            text/event-stream:
              schema:
                type: string
                description: SSE events with EventJSON data payloads.

  /api/history:
    get:
      summary: Recent lifecycle events
      description: |
        The most recent lifecycle events recorded since the console started,
        oldest first. Capped at 50 events (ring buffer). Read-only.
      responses:
        "200":
          description: Event history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoryResponse"

  /api/origins:
    get:
      summary: Trusted origins
      description: The browser origins currently trusted for cross-origin access.
      responses:
        "200":
          description: Origin list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OriginsResponse"
    post:
      summary: Replace trusted origins
      description: Replace the entire trusted-origin list.
      security:
        - tokenHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                trusted:
                  type: array
                  items:
                    type: string
              required: [trusted]
      responses:
        "200":
          description: Updated origins
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OriginsResponse"
        "400":
          description: Malformed body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Would lock out current origin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/config/reload:
    post:
      summary: Reload configuration
      description: >-
        Apply mabo-ctl.yaml as it now reads on disk. A running service whose
        command, directory, environment, port or tty changed is restarted under
        its new definition; a running service the file no longer declares is
        stopped; every other service keeps running. A changed declared port is
        adopted even when .mabo-ctl/run.env pinned the old one. The reload runs
        to completion even if the client disconnects.
      security:
        - tokenHeader: []
      responses:
        "200":
          description: >-
            The new configuration is in force. ok is false when a service could
            not be stopped or started; error says which, events say why.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReloadResponse"
        "409":
          description: A start, stop or restart is in progress; the reload was not attempted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: >-
            Nothing was applied — the file did not load, validate or resolve, a
            service it needs cannot run, or a removed service survived its stop —
            and the previous configuration remains in force.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/start-all:
    post:
      summary: Start all services
      description: "Start every declared service (including autostart: false)."
      security:
        - tokenHeader: []
      responses:
        "200":
          description: Operation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MutationResponse"
        "409":
          description: A configuration reload is in progress; retry when it finishes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Too many operations in flight
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/stop-all:
    post:
      summary: Stop all services
      description: Stop every running service.
      security:
        - tokenHeader: []
      responses:
        "200":
          description: Operation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MutationResponse"
        "409":
          description: A configuration reload is in progress; retry when it finishes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Too many operations in flight
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/restart-all:
    post:
      summary: Restart running services
      description: >-
        Restart every service that is running now (running, ready, slow or
        degraded). Stopped, failed and exited services are left alone.
      security:
        - tokenHeader: []
      responses:
        "200":
          description: Operation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MutationResponse"
        "409":
          description: Nothing is running, or a configuration reload is in progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Too many operations in flight
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  "/api/{svc}/start":
    post:
      summary: Start one service
      description: Start one named service.
      security:
        - tokenHeader: []
      parameters:
        - $ref: "#/components/parameters/svc"
      responses:
        "200":
          description: Operation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MutationResponse"
        "409":
          description: A configuration reload is in progress; retry when it finishes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Unknown service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorWithValid"
        "429":
          description: Too many operations in flight
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  "/api/{svc}/stop":
    post:
      summary: Stop one service
      description: Stop one named service.
      security:
        - tokenHeader: []
      parameters:
        - $ref: "#/components/parameters/svc"
      responses:
        "200":
          description: Operation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MutationResponse"
        "409":
          description: A configuration reload is in progress; retry when it finishes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Unknown service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorWithValid"

  "/api/{svc}/restart":
    post:
      summary: Restart one service
      description: Restart one named service (stop, then start).
      security:
        - tokenHeader: []
      parameters:
        - $ref: "#/components/parameters/svc"
      responses:
        "200":
          description: Operation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MutationResponse"
        "409":
          description: A configuration reload is in progress; retry when it finishes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Unknown service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorWithValid"

  /api/terminals:
    get:
      summary: List terminals
      description: >-
        The open Terminal-tab shells, oldest first. 404 unless serve runs with
        --terminal (or console_terminal true). Loopback-only by default; remote
        shells require explicit --terminal and
        --i-know-allow-remote-terminal-is-dangerous, plus
        --i-know-this-is-dangerous for a non-loopback bind. Operator-only;
        Host and Origin must name the bound address or, with remote-terminal
        permission, an explicitly trusted --allow-origin. Proxy headers are
        permitted only with that permission and never establish trust.
        Without remote-terminal permission on a non-loopback bind, the console
        keeps serving with terminals disabled and these routes return 404.
      security:
        - sessionCookie: []
        - tokenHeader: []
        - queryToken: []
      responses:
        "200":
          description: Open terminals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Terminal"
        "403":
          $ref: "#/components/responses/TerminalNotLocal"
        "404":
          $ref: "#/components/responses/TerminalOff"
    post:
      summary: Open a terminal
      description: Start a login shell on a pty in the repository root, running as you.
      security:
        - tokenHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TerminalSize"
      responses:
        "200":
          description: The new terminal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Terminal"
        "429":
          description: 16 terminals are already open
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/TerminalNotLocal"
        "404":
          $ref: "#/components/responses/TerminalOff"

  "/api/terminals/{id}/stream":
    get:
      summary: Terminal output (SSE)
      description: >-
        The scrollback as one frame marked "replay": true, then live output,
        then {"end": true} when the shell exits. data is base64-encoded pty
        output. A client must not answer terminal queries found in the replay
        frame.
      security:
        - sessionCookie: []
        - tokenHeader: []
        - queryToken: []
      parameters:
        - $ref: "#/components/parameters/terminalId"
      responses:
        "200":
          description: Server-sent events of {"data":"<base64>"} or {"end":true}
          content:
            text/event-stream:
              schema:
                type: string
        "403":
          $ref: "#/components/responses/TerminalNotLocal"
        "404":
          description: Unknown terminal, or the terminal is off
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  "/api/terminals/{id}/input":
    post:
      summary: Type into a terminal
      security:
        - tokenHeader: []
      parameters:
        - $ref: "#/components/parameters/terminalId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: string
                  description: Text to write to the shell, up to 1 MiB
      responses:
        "204":
          description: Delivered
        "403":
          $ref: "#/components/responses/TerminalNotLocal"
        "404":
          description: Unknown terminal, or the terminal is off
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "410":
          description: The terminal has ended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  "/api/terminals/{id}/resize":
    post:
      summary: Resize a terminal
      security:
        - tokenHeader: []
      parameters:
        - $ref: "#/components/parameters/terminalId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TerminalSize"
      responses:
        "204":
          description: Resized
        "403":
          $ref: "#/components/responses/TerminalNotLocal"
        "404":
          description: Unknown terminal, or the terminal is off
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  "/api/terminals/{id}/close":
    post:
      summary: Close a terminal
      description: SIGHUP to the shell's session, then SIGKILL after 2 seconds.
      security:
        - tokenHeader: []
      parameters:
        - $ref: "#/components/parameters/terminalId"
      responses:
        "204":
          description: Closed
        "403":
          $ref: "#/components/responses/TerminalNotLocal"
        "404":
          description: Unknown terminal, or the terminal is off
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /assets/xterm.js:
    get:
      summary: Terminal emulator bundle
      description: xterm.js 6.0.0 with its fit and web-links addons, vendored (MIT).
      security:
        - sessionCookie: []
        - tokenHeader: []
        - queryToken: []
      responses:
        "200":
          description: JavaScript
          content:
            application/javascript:
              schema:
                type: string

  /api-docs:
    get:
      summary: Interactive API reference page
      description: |
        API reference page rendered by RapiDoc (vendored, no CDN, no external
        requests). The spec is loaded from /api/openapi.yaml and the try-it
        server is pinned to the address mabo-ctl actually bound. Every
        operation has a working try-it playground: the session token is wired
        in automatically as the X-Mabo-Ctl-Token api-key (see the api-key
        attributes on the page's rapi-doc element), so reads and mutations
        are authenticated exactly like the console buttons. Live SSE streams
        render as data arrives.
      security:
        - sessionCookie: []
        - tokenHeader: []
        - queryToken: []
      responses:
        "200":
          description: API reference HTML page
          content:
            text/html:
              schema:
                type: string
        "401":
          description: Session token required (shows unlock form)

  /api/openapi.yaml:
    get:
      summary: OpenAPI 3.0 specification (YAML)
      description: |
        The OpenAPI 3.0 specification in YAML. The canonical source is
        docs/openapi.yaml; the embedded copy must stay in sync.
      security:
        - sessionCookie: []
        - tokenHeader: []
        - queryToken: []
      responses:
        "200":
          description: OpenAPI specification
          content:
            text/yaml:
              schema:
                type: string
        "401":
          description: Session token required

  /api-docs/rapidoc.js:
    get:
      summary: Vendored RapiDoc bundle
      description: |
        The embedded RapiDoc bundle (MIT) that renders /api-docs.
        A static, session-gated asset: it defines the rapi-doc custom element,
        so only a browser that can load the documented page may load its
        renderer.
      security:
        - sessionCookie: []
        - tokenHeader: []
        - queryToken: []
      responses:
        "200":
          description: JavaScript bundle
          content:
            application/javascript:
              schema:
                type: string
        "401":
          description: Session token required

  /api/access:
    get:
      summary: Operator only — list shares and guest browser sessions
      responses:
        "200":
          description: Bounded in-memory access history; secrets are never listed
          content:
            application/json:
              schema:
                type: object
                required: [shares, guests]
                properties:
                  shares:
                    type: array
                    items:
                      $ref: '#/components/schemas/SharedAccess'
                  guests:
                    type: array
                    maxItems: 256
                    items:
                      $ref: '#/components/schemas/GuestAccess'
        "403":
          description: Missing operator credential

  /api/access/token:
    post:
      summary: Operator only — rotate the operator token and revoke all shares
      description: Runtime-only. Sets a replacement HttpOnly cookie; old credentials and streams cease working. Blank generates a random key. Previously shared tokens cannot be promoted to operator.
      security:
        - tokenHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  maxLength: 256
                  description: Blank generates; otherwise at least four ASCII letters/digits or . _ ~ -; must differ from current token
      responses:
        "200":
          description: New operator credential; do not log
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
        "400":
          description: Invalid, unchanged or previously shared token
        "403":
          description: Operator header required

  /api/access/shares:
    post:
      summary: Operator only — create a scoped sharing capability
      description: Maximum 32 active links and 128 creations per serve run. Blank token generates a random key; previously used tokens cannot be reused. This does not publish the loopback listener or relax Host/Origin guards.
      security:
        - tokenHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, role]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 80
                role:
                  type: string
                  enum: [read, view, write]
                token:
                  type: string
                  maxLength: 256
                  description: Blank generates; otherwise at least 16 ASCII letters/digits or . _ ~ -
      responses:
        "201":
          description: Secret shown once; form the URL using the browser's reachable origin
          content:
            application/json:
              schema:
                type: object
                properties:
                  share:
                    $ref: '#/components/schemas/SharedAccess'
                  token:
                    type: string
        "400":
          description: Invalid name, role or custom token
        "403":
          description: Operator header required
        "409":
          description: Token already used
        "429":
          description: Share limit reached

  /api/access/shares/{id}/revoke:
    post:
      summary: Operator only — terminate all sessions using this share
      security:
        - tokenHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Token invalidated and streams cancelled; all guests using this link lose access
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        "403":
          description: Operator header required
        "404":
          description: Unknown or already revoked link

  /api/mirror:
    get:
      summary: Operator or VIEW only — current presentation state
      description: VIEW polls every 100ms. Inactive when the publisher has not updated within five seconds. Synchronizes navigation/log controls and visual cursor/click indicators, not screen pixels or historical log buffers. Never replays input or carries terminal contents, credentials, clipboard or security form values. Positions are normalized within known non-security regions; no motion/click history is stored.
      responses:
        "200":
          description: Current presentation state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MirrorView'
        "403":
          description: VIEW or operator credential required
    post:
      summary: Operator only — broadcast non-security presentation state
      description: A different active source receives 409 unless takeover is true. The server maps terminal to output and removes pointers/clicks for terminal or inactive broadcasts. Only known non-security pointer regions are allowed. Clients publish motion at most 10 times per second and idle heartbeats every 500ms. Valid service names are required unless empty. Publishing heartbeats are not audit-logged; refusals are.
      security:
        - tokenHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MirrorView'
      responses:
        "200":
          description: Presentation accepted
        "400":
          description: Invalid presentation state
        "403":
          description: Operator header required
        "409":
          description: Another operator tab holds the five-second publishing lease

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: mabo-ctl_console_{port}
      description: >-
        Session cookie set by opening the printed URL with ?token=. The name
        embeds the bound port (mabo-ctl_console_<port>) because cookies are not
        port-scoped and two consoles on the same loopback host must not
        overwrite each other.
    queryToken:
      type: apiKey
      in: query
      name: token
      description: Token in URL query (sets cookie on first use)
    tokenHeader:
      type: apiKey
      in: header
      name: X-Mabo-Ctl-Token
      description: Session token for reads; required for all POST routes (CSRF defence)

  parameters:
    svc:
      name: svc
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-zA-Z0-9][a-zA-Z0-9_-]*$"
      description: Declared service name
    terminalId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Terminal id from GET /api/terminals

  responses:
    TerminalOff:
      description: The terminal is off; serve was started without --terminal
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TerminalNotLocal:
      description: Terminal access denied (operator-only, bound or explicitly trusted Host and Origin required)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Terminal:
      type: object
      required: [id, pid, started_at]
      properties:
        id:
          type: string
        pid:
          type: integer
        started_at:
          type: string
          format: date-time
    TerminalSize:
      type: object
      properties:
        cols:
          type: integer
          minimum: 2
          maximum: 1000
        rows:
          type: integer
          minimum: 2
          maximum: 500
    ServiceInfo:
      type: object
      properties:
        name:
          type: string
          description: Declared service name
        dir:
          type: string
          description: Resolved absolute working directory
        port:
          type: integer
          description: Resolved port; 0 when no port is declared
        health:
          type: string
          description: Expanded readiness URL; "" when no probe
        runtime:
          type: string
          description: 'Declared runtime ("", "system", "conda:x", "node:x")'
        cmd:
          type: array
          items:
            type: string
          description: Expanded argv, cmd[0] absolute
        cmd_line:
          type: string
          description: cmd rendered as one shell-quoted line
        cmd_error:
          type: string
          description: Why cmd[0] could not be resolved (omitted when empty)
        env:
          type: array
          items:
            $ref: "#/components/schemas/EnvVar"
          description: Declared environment; values redacted by key
        depends_on:
          type: array
          items:
            type: string
          description: Services that start first
        color:
          type: string
          description: Label colour from config

    EnvVar:
      type: object
      properties:
        key:
          type: string
        value:
          type: string
          description: Redacted when credential-shaped

    StatusRecord:
      type: object
      description: |
        Stable machine contract. Fields and phase values may not change
        without a version bump.
      example:
        service: backend
        phase: ready
        pid: 41825
        port: 7102
        health: http://localhost:7102/health
        http_status: 200
        detail: HTTP 200
        log_path: .mabo-ctl/logs/backend.log
        elapsed_ms: 2000
        started_at: "2026-08-28T10:00:00Z"
        uptime_ms: 2000
        exit_code: -1
        exit_signal: ""
        exited_at: ""
      properties:
        service:
          type: string
        phase:
          type: string
          enum: [stopped, running, ready, slow, degraded, failed, exited]
        pid:
          type: integer
        port:
          type: integer
        health:
          type: string
          description: Redacted health URL
        http_status:
          type: integer
        detail:
          type: string
          description: Human-readable detail (redacted health URL)
        log_path:
          type: string
        elapsed_ms:
          type: integer
          description: Milliseconds since spawn
        started_at:
          type: string
          format: date-time
          description: RFC 3339, or "" when unknown
        uptime_ms:
          type: integer
          description: Milliseconds the live process has been up
        exit_code:
          type: integer
          description: Last observed exit status, -1 when signalled or unknown
        exit_signal:
          type: string
          description: 'Signal name ("SIGKILL"), "" when none'
        exited_at:
          type: string
          format: date-time
          description: RFC 3339, or "" when not seen die

    LogLine:
      type: object
      properties:
        service:
          type: string
        line:
          type: string
          description: >-
            One log line. A line over 256 KiB is cut and ends with
            "… [mabo-ctl: line truncated to <kept> of <total> bytes; the log file has all of it]".

    StreamEnd:
      type: object
      properties:
        service:
          type: string
        end:
          type: boolean
        error:
          type: string
          description: Optional reason the stream stopped

    EventJSON:
      type: object
      properties:
        service:
          type: string
        phase:
          type: string
          enum: [stopped, running, ready, slow, degraded, failed, exited]
        msg:
          type: string
        error:
          type: string

    LogsResponse:
      type: object
      example:
        service: backend
        lines:
          - "INFO:     Uvicorn running on http://0.0.0.0:7102"
          - "INFO:     Started reloader process [41825]"
        count: 2
      properties:
        service:
          type: string
        lines:
          type: array
          description: >-
            Log lines, oldest first. May start with an omission marker line and
            contain 256 KiB truncation suffixes; see the log routes in docs/API.md.
          items:
            type: string
        count:
          type: integer

    MutationResponse:
      type: object
      example:
        operation: start
        services: [backend, frontend]
        ok: true
        error: ""
        events:
          - service: backend
            phase: running
            msg: spawned
          - service: backend
            phase: ready
            msg: HTTP 200
      properties:
        operation:
          type: string
          enum: [start, stop, restart]
        services:
          type: array
          items:
            type: string
        ok:
          type: boolean
        error:
          type: string
          description: Supervisor error text when ok is false
        events:
          type: array
          items:
            $ref: "#/components/schemas/EventJSON"

    ReloadResponse:
      type: object
      example:
        ok: false
        error: "services did not start: worker"
        stopped: [legacy]
        restarted: [backend, worker]
        events:
          - service: worker
            phase: failed
            msg: "failed: process died"
      properties:
        ok:
          type: boolean
          description: Every affected service was stopped and started cleanly
        error:
          type: string
          description: What failed when ok is false
        stopped:
          type: array
          items:
            type: string
          description: Running services the new configuration removed, stopped
        restarted:
          type: array
          items:
            type: string
          description: Services started under their new definition
        events:
          type: array
          items:
            $ref: "#/components/schemas/EventJSON"
      required: [ok, stopped, restarted, events]

    OriginsResponse:
      type: object
      example:
        trusted:
          - https://my-tunnel.example.com
        implicit: http://127.0.0.1:7999
        origin: http://127.0.0.1:7999
        max: 10
      properties:
        trusted:
          type: array
          items:
            type: string
          description: Editable allowlist, canonical and sorted
        implicit:
          type: string
          description: Address mabo-ctl bound; always accepted
        origin:
          type: string
          description: Requester's Origin header
        max:
          type: integer
          description: Cap on trusted list

    HistoryResponse:
      type: object
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/EventJSON"
          description: Ring contents, oldest first (max 50)

    SharedAccess:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [read, view, write]
        created_at:
          type: string
          format: date-time

    GuestAccess:
      type: object
      description: Browser-and-link identity, not a verified person. Same-link tabs are grouped; different links in one browser retain independent records. Address is the socket peer (may be a proxy); browser is the unverified User-Agent. UI considers last_seen within 15 seconds active, not human activity. Session ID does not expose the browser cookie. Only the latest service action is retained; no request bodies, queries or action error contents.
      properties:
        id:
          type: string
        share_id:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [read, view, write]
        address:
          type: string
        browser:
          type: string
        joined_at:
          type: string
          format: date-time
        last_seen:
          type: string
          format: date-time
        revoked:
          type: boolean
        revoked_at:
          type: string
          format: date-time
        page_opens:
          type: integer
          minimum: 1
          description: Console opens/reloads for this link and browser
        requests:
          type: integer
          minimum: 0
          description: Authenticated guarded requests including polls and role denials; no browser attribution without the visitor cookie
        denied_requests:
          type: integer
          minimum: 0
          description: Valid guest credential blocked by role, not invalid tokens or Host/Origin refusals
        actions:
          type: integer
          minimum: 0
          description: Accepted service lifecycle operations, not HTTP polls or clicks
        last_request:
          type: string
          description: HTTP method and route template only; no raw paths or queries
        last_action:
          $ref: '#/components/schemas/GuestAction'

    GuestAction:
      type: object
      properties:
        operation:
          type: string
          enum: [start, stop, restart]
        services:
          type: array
          items:
            type: string
          description: Requested services; empty means all
        outcome:
          type: string
          enum: [running, completed, failed]
          description: Actual supervisor outcome, independent of HTTP status
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time

    MirrorView:
      type: object
      properties:
        source:
          type: string
          minLength: 1
          maxLength: 80
        active:
          type: boolean
        takeover:
          type: boolean
          description: POST only; explicitly replace another active publisher
        updated_at:
          type: string
          format: date-time
          description: Server-set timestamp
        service:
          type: string
        tab:
          type: string
          enum: [output, config, api, terminal]
          description: Terminal is accepted only on publish and normalized to output; no terminal contents are mirrored
        config_section:
          type: string
          enum: [overview, services, sharing, security]
          description: Only overview/services are returned. Sharing/security publish values are mapped to overview, suppressing pointer/click data while the private section is open. Omission defaults to overview.
        all:
          type: boolean
        filter:
          type: string
          maxLength: 512
        level:
          type: string
          enum: ['', error, warn, info, debug]
        paused:
          type: boolean
        follow:
          type: boolean
        scroll:
          type: number
          minimum: 0
          maximum: 1
        separators:
          type: boolean
        pretty:
          type: boolean
          description: Pretty-print JSON log lines.
        font_size:
          type: integer
          minimum: 10
          maximum: 18
        details:
          type: boolean
        pointer:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/MirrorPoint'
        click:
          type: object
          nullable: true
          required: [point, sequence]
          properties:
            point:
              $ref: '#/components/schemas/MirrorPoint'
            sequence:
              type: integer
              format: int64
              minimum: 1
              maximum: 9007199254740991
              description: De-duplicates a brief visual ripple; never an input event to replay

    MirrorPoint:
      type: object
      required: [region, x, y]
      properties:
        region:
          type: string
          enum: [sidebar, tabs, output, cfg-source, cfg-ports, cfg-services]
        x:
          type: number
          minimum: 0
          maximum: 1
        y:
          type: number
          minimum: 0
          maximum: 1

    Error:
      type: object
      example:
        error: unknown service
      properties:
        error:
          type: string

    ErrorWithValid:
      type: object
      example:
        error: unknown service
        valid: [backend, frontend, worker]
      properties:
        error:
          type: string
        valid:
          type: array
          items:
            type: string
          description: List of valid service names
