<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>mabo-ctl API Reference</title>
  <meta name="description" content="Interactive API reference for the mabo-ctl web console HTTP API">
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .loading {
      display: flex; align-items: center; justify-content: center;
      height: 100vh; color: #666; font-size: 16px;
    }
  </style>
</head>
<body>
  <div id="loading" class="loading">Loading API reference…</div>

  <script>
    // Inline the OpenAPI spec to avoid CORS issues when opened from disk.
    // If served alongside openapi.yaml, fetch it instead.
    (function() {
      fetch('./openapi.yaml')
        .then(function(r) {
          if (!r.ok) throw new Error('not ok');
          return r.text();
        })
        .then(function(yaml) {
          window.__OPENAPI_SPEC = yaml;
          loadRedoc();
        })
        .catch(function() {
          // Fallback: the spec must be pasted in or served from the same origin.
          document.getElementById('loading').textContent =
            'Could not load openapi.yaml. Serve this directory over HTTP:\n' +
            '  python3 -m http.server 8080\n' +
            'Then open http://localhost:8080/api-docs.html';
        });
    })();

    function loadRedoc() {
      var script = document.createElement('script');
      script.src = 'https://cdn.redoc.ly/redoc/latest/bundles/redoc.standalone.js';
      script.onload = function() {
        document.getElementById('loading').remove();
        var spec = window.__OPENAPI_SPEC;
        // If the spec is YAML, Redoc can parse it if we loaded js-yaml,
        // but the standalone bundle handles YAML natively.
        Redoc.init(spec, {
          scrollYOffset: 0,
          hideDownloadButton: false,
          expandResponses: '200',
          jsonSampleExpandLevel: 2,
          sortPropsAlphabetically: true,
          pathInMiddlePanel: true,
          nativeScrollbars: true,
        }, document.body);
      };
      document.head.appendChild(script);
    }
  </script>
</body>
</html>
